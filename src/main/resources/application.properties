spring.application.name=bankapp

# MySQL Database configuration
# Values below are LOCAL DEV DEFAULTS ONLY. In Kubernetes, these are all
# overridden by the SPRING_DATASOURCE_* environment variables set in
# k8s/manifest.yaml (env vars take precedence over this file automatically
# in Spring Boot - no code change needed for that part).
#
# For local development, set your own password via an environment
# variable instead of hardcoding it here:
#   export SPRING_DATASOURCE_PASSWORD=your_local_password
spring.datasource.url=jdbc:mysql://localhost:3306/bankappdb?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:changeme}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=never

# JPA & Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.show-sql=true
