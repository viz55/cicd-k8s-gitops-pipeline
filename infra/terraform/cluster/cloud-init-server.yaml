#cloud-config
package_update: true

runcmd:
  # Open the local firewall for k3s and standard web ports (OCI's security
  # list handles the network-level rules; iptables handles the host itself).
  - sudo iptables -I INPUT 1 -m state --state NEW -p tcp --dport 6443 -j ACCEPT
  - sudo iptables -I INPUT 1 -m state --state NEW -p tcp --dport 80 -j ACCEPT
  - sudo iptables -I INPUT 1 -m state --state NEW -p tcp --dport 443 -j ACCEPT
  - sudo netfilter-persistent save

  # Install k3s: --write-kubeconfig-mode makes the kubeconfig readable
  # without sudo, --disable traefik because we're installing ingress-nginx
  # ourselves later (matches the diagram's explicit ingress choice).
  - |
    PUBLIC_IP=$(curl -s -H "Authorization: Bearer Oracle" -L http://169.254.169.254/opc/v2/vnics/ | python3 -c "import sys,json; print(json.load(sys.stdin)[0]['publicIp'])")
    curl -sfL https://get.k3s.io | sh -s - server --write-kubeconfig-mode 644 --disable traefik --tls-san "$${PUBLIC_IP}"
  # Print the join token to a predictable path so it can be fetched over
  # SSH for adding agent nodes later.
  - cat /var/lib/rancher/k3s/server/node-token > /home/ubuntu/node-token
  - chown ubuntu:ubuntu /home/ubuntu/node-token
