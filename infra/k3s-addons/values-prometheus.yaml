alertmanager:
  enabled: true # was disabled in the original; enable it, it's free and this is the whole point of alerting
prometheus:
  prometheusSpec:
    service:
      type: ClusterIP # was LoadBalancer — no cloud LB exists here, we reach it via Ingress instead
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path # was ebs-sc
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 5Gi
grafana:
  enabled: true
  service:
    type: ClusterIP # was LoadBalancer — expose via Ingress + your domain instead (see below)
  adminUser: admin
  adminPassword: CHANGE_ME # set via --set on the helm command, never commit a real password here
nodeExporter:
  service:
    type: ClusterIP
kubeStateMetrics:
  enabled: true
additionalScrapeConfigs:
  - job_name: node-exporter
    static_configs:
      - targets:
          - node-exporter:9100
  - job_name: kube-state-metrics
    static_configs:
      - targets:
          - kube-state-metrics:8080
