# Jenkins Helm values — installs Jenkins with baseline config already
# applied via JCasC (Configuration as Code), instead of clicking through
# the setup wizard. This is the pattern real teams use so a Jenkins
# instance can be torn down and rebuilt identically from git, not
# hand-configured and undocumented.
controller:
 # override with --set on the helm command, never commit a real one

  installPlugins:
    - kubernetes
    - workflow-aggregator
    - git
    - configuration-as-code
    - sonar
    - docker-workflow
    - pipeline-stage-view
    - email-ext
    - pipeline-maven
    - matrix-auth
    - config-file-provider
    - github

  JCasC:
    defaultConfig: true
    configScripts:
      # Registers the "maven3" tool referenced in Jenkinsfile-CI's
      # `tools { maven 'maven3' }` block, and "sonar-scanner" referenced
      # in `SCANNER_HOME = tool 'sonar-scanner'`.
      tool-config: |
        tool:
          maven:
            installations:
              - name: "maven3"
                properties:
                  - installSource:
                      installers:
                        - maven:
                            id: "3.9.6"
      # Registers the SonarQube server connection Jenkinsfile-CI expects
      # via `withSonarQubeEnv('sonar')`. The actual token is added
      # separately as a credential, referenced here by ID only.
      sonar-config: |
        unclassified:
          sonarGlobalConfiguration:
            installations:
              - name: "sonar"
                serverUrl: "http://sonarqube-sonarqube.sonarqube.svc.cluster.local:9000" # in-cluster service DNS, see docs/IMPLEMENTATION-GUIDE.md
                credentialsId: "sonar-token"

  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "1"
      memory: "2Gi"
      
  serviceType: ClusterIP # exposed via Ingress, not a cloud LoadBalancer

agent:
  image:
    registry: ""
    repository: "jenkins/inbound-agent"
    tag: "3384.v60d89463d9e0-1"
  resources:
    requests:
      cpu: "200m"
      memory: "512Mi"
    limits:
      cpu: "1"
      memory: "2Gi"
  additionalContainers:
    - sideContainerName: "dind"
      image:
        repository: "docker"
        tag: "dind"
      command: "dockerd-entrypoint.sh"
      args: ""
      privileged: true
      resources:
        requests:
          cpu: "300m"
          memory: "1Gi"
        limits:
          cpu: "2"
          memory: "4Gi"

persistence:
  enabled: true
  storageClass: local-path
  size: 8Gi
