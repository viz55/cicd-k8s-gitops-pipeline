# These four namespaces mirror the diagram exactly: JENKINS-NAMESPACE,
# SONAR-NAMESPACE, Nexus3-NAMESPACE, and Monitoring Namespace.
#
# WHY namespaces at all, for a single-person project:
# Namespaces are Kubernetes' isolation boundary for RBAC, resource quotas,
# and network policy. Companies use one namespace per application/team so
# that a misconfigured Role in "jenkins" can't accidentally touch pods in
# "webapps". Using namespaces here — even solo — is one of the cheapest,
# most visible signals in an interview that you understand multi-tenant
# cluster design, not just "I got kubectl apply to work."
apiVersion: v1
kind: Namespace
metadata:
  name: jenkins
---
apiVersion: v1
kind: Namespace
metadata:
  name: sonarqube
---
apiVersion: v1
kind: Namespace
metadata:
  name: nexus3
---
apiVersion: v1
kind: Namespace
metadata:
  name: webapps
---
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
