apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: bankapp-hpa
  namespace: webapps
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: bankapp
  minReplicas: 2
  maxReplicas: 4
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 50
# NOTE: this requires metrics-server running in the cluster.
# k3s does NOT bundle it by default (unlike some managed offerings).
# Install with:
#   kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml
# On k3s specifically, metrics-server needs one extra flag due to the
# self-signed kubelet certs — see docs/PHASE2-CD-SETUP.md.
